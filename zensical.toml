[project]
site_name = "KickCAT"
site_description = "A lightweight, efficient EtherCAT master/slave stack for embedded and real-time systems"
site_url = "https://leducp.github.io/KickCAT/"
repo_url = "https://github.com/leducp/KickCAT"
repo_name = "leducp/KickCAT"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "build/docs-site"
# Abbreviations and shared links, appended to every page by pymdownx.snippets
exclude_docs = "includes/"

nav = [
  { "Home" = "index.md" },
  { "Features" = "FEATURES.md" },
  { "Building" = "BUILDING.md" },
  { "Hardware" = "HARDWARE.md" },
  { "Simulation" = "SIMULATION.md" },
  { "Tools" = "TOOLS.md" },
  { "Performance" = "PERFORMANCE.md" },
  { "Developer guide" = [
    { "Introduction" = "guide/README.md" },
    { "0.0 How to read this guide" = "guide/how-to-read.md" },
    { "0.1 What is EtherCAT?" = "guide/what-is-ethercat.md" },
    { "0.2 Frames and datagrams" = "guide/frames-and-datagrams.md" },
    { "0.3 Inside a slave: the ESC" = "guide/inside-a-slave.md" },
    { "0.4 The EtherCAT state machine" = "guide/state-machine.md" },
    { "0.5 Process data" = "guide/process-data.md" },
    { "0.6 Mailboxes: CoE and FoE" = "guide/mailboxes.md" },
    { "0.7 Topology, redundancy and clocks" = "guide/topology-and-clocks.md" },
    { "0.8 Describing a device" = "guide/device-descriptions.md" },
    { "1 Overview and principles" = "guide/principles.md" },
    { "2 A map of the code" = "architecture.md" },
    { "3 The master" = "guide/master.md" },
    { "4 Transport" = "guide/transport.md" },
    { "5 Mailboxes in KickCAT" = "guide/mailbox-implementation.md" },
    { "6 The slave stack" = "guide/slave.md" },
    { "7 Distributed clocks" = "guide/distributed-clocks.md" },
    { "8 Simulation internals" = "guide/simulation.md" },
    { "9 From XML to bytes" = "guide/from-xml-to-bytes.md" },
    { "10 Operating systems and porting" = "guide/os-and-porting.md" },
    { "11 Testing a change" = "guide/testing.md" },
  ] },
  { "Contributing" = "CONTRIBUTING.md" },
  { "Release procedure" = "RELEASE.md" },
]

[project.theme]
name = "material"
logo = "kickCAT_logo_dark_mode.png"
favicon = "kickCAT_logo_light_mode.png"
features = [
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = { base_path = ["."], check_paths = true, auto_append = [
  "docs/includes/abbreviations.md",
  "docs/includes/links.md",
] }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed = { alternate_style = true }
