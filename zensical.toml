[project]
site_name = "KickCAT"
site_description = "A lightweight, efficient EtherCAT master/slave stack for embedded and real-time systems"
site_url = "https://leducp.github.io/KickCAT/"
repo_url = "https://github.com/leducp/KickCAT"
repo_name = "leducp/KickCAT"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "build/docs-site"
# Abbreviations and shared links, appended to every page by pymdownx.snippets
exclude_docs = "includes/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "get-started/installation.md" },
    { "Your first bus" = "get-started/first-bus.md" },
    { "The ecosystem" = "get-started/ecosystem.md" },
    { "EtherCAT primer" = "get-started/ethercat-primer.md" },
  ] },
  { "User guide" = [
    { "Features" = "user-guide/features.md" },
    { "Building" = "user-guide/building.md" },
    { "Hardware" = "user-guide/hardware.md" },
    { "Simulation" = "user-guide/simulation.md" },
    { "Tools" = "user-guide/tools.md" },
    { "Performance" = "user-guide/realtime.md" },
  ] },
  { "Developer guide" = [
    { "Overview" = "developer-guide/index.md" },
    { "How to read this guide" = "developer-guide/how-to-read.md" },
    { "Architecture" = [
      { "Overview and principles" = "developer-guide/architecture/principles.md" },
      { "A map of the code" = "developer-guide/architecture/code-map.md" },
      { "The master" = "developer-guide/architecture/master.md" },
      { "Transport" = "developer-guide/architecture/transport.md" },
      { "Mailboxes in KickCAT" = "developer-guide/architecture/mailboxes.md" },
      { "The slave stack" = "developer-guide/architecture/slave.md" },
      { "Distributed clocks" = "developer-guide/architecture/distributed-clocks.md" },
      { "Simulation internals" = "developer-guide/architecture/emulation.md" },
      { "From XML to bytes" = "developer-guide/architecture/device-descriptions.md" },
      { "Operating systems and porting" = "developer-guide/architecture/platform.md" },
    ] },
    { "Contributing" = [
      { "Guidelines" = "developer-guide/contributing/index.md" },
      { "Testing a change" = "developer-guide/contributing/testing.md" },
      { "Writing docs" = "developer-guide/contributing/writing-docs.md" },
      { "Release procedure" = "developer-guide/contributing/release.md" },
    ] },
  ] },
  { "Reference" = [
    { "Glossary" = "reference/glossary.md" },
  ] },
]

[project.theme]
name = "material"
logo = "assets/kickCAT_logo_dark_mode.png"
favicon = "assets/kickCAT_logo_light_mode.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = { base_path = ["."], check_paths = true, dedent_subsections = true, auto_append = [
  "docs/includes/abbreviations.md",
  "docs/includes/links.md",
] }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed = { alternate_style = true }
