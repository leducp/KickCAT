name: Docs

# Publishing needs the repository's Pages source set to "GitHub Actions".
on:
  pull_request:
    branches: [master]
    paths: ['docs/**', 'zensical.toml', '.github/workflows/docs.yml', 'examples/**', 'py_bindings/examples/**']
  push:
    branches: [master]
    paths: ['docs/**', 'zensical.toml', '.github/workflows/docs.yml', 'examples/**', 'py_bindings/examples/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uvx zensical@0.1.1 build --clean --strict
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
